<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — NSDC Student Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
  }
  h1 { font-size: 1.25rem; color: #111827; margin-bottom: 0.25rem; }
  p.sub { color: #6b7280; font-size: 0.875rem; margin-bottom: 1.5rem; }
  .btn {
    display: block; width: 100%; padding: 0.6875rem; text-align: center;
    background: #2563eb; color: #fff; border-radius: 8px;
    font-size: 0.9375rem; font-weight: 600; text-decoration: none;
  }
  .btn:hover { background: #1d4ed8; }
  .note { color: #6b7280; font-size: 0.8125rem; margin-top: 0.875rem; }
  .error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 0.625rem 0.75rem;
    font-size: 0.8125rem;
    margin-bottom: 1rem;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>NSDC Student Portal</h1>
    <p class="sub">Sign in to download student data</p>
    <div class="error" id="error"></div>
    <a class="btn" href="/auth/google">Sign in with Scaler</a>
    <p class="note" id="note"></p>
  </div>
  <script src="/login.js"></script>
</body>
</html>
