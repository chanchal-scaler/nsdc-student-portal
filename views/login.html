<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — NSDC Student Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
  }
  h1 { font-size: 1.25rem; color: #111827; margin-bottom: 0.25rem; }
  p.sub { color: #6b7280; font-size: 0.875rem; margin-bottom: 1.5rem; }
  label { display: block; font-size: 0.8125rem; font-weight: 600; color: #374151; margin-bottom: 0.375rem; }
  input {
    width: 100%;
    padding: 0.625rem 0.75rem;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.9375rem;
    margin-bottom: 1rem;
  }
  input:focus { outline: 2px solid #2563eb; border-color: transparent; }
  button {
    width: 100%;
    padding: 0.6875rem;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.9375rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .btn {
    display: block; width: 100%; padding: 0.6875rem; text-align: center;
    background: #2563eb; color: #fff; border-radius: 8px;
    font-size: 0.9375rem; font-weight: 600; text-decoration: none;
  }
  .btn:hover { background: #1d4ed8; }
  .note { color: #6b7280; font-size: 0.8125rem; margin-top: 0.875rem; }
  .dev { display: none; margin-top: 1.5rem; border-top: 1px solid #e5e7eb; padding-top: 1.25rem; }
  .dev-title { color: #92400e; background: #fffbeb; border: 1px solid #fde68a;
    border-radius: 8px; padding: 0.5rem 0.625rem; font-size: 0.75rem; margin-bottom: 0.875rem; }
  .error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 0.625rem 0.75rem;
    font-size: 0.8125rem;
    margin-bottom: 1rem;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>NSDC Student Portal</h1>
    <p class="sub">Sign in to download student data</p>
    <div class="error" id="error"></div>
    <a class="btn" href="/auth/google">Sign in with Scaler</a>
    <p class="note" id="note"></p>

    <form class="dev" id="dev" method="POST" action="/auth/dev">
      <p class="dev-title">Local testing only — this is not on the deployed portal.</p>
      <label for="email">Pretend Google confirmed this address</label>
      <input type="email" id="email" name="email" required autocomplete="username">
      <button type="submit">Sign in without Google</button>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>
