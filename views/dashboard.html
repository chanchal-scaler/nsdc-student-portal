<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSDC Student Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6;
    min-height: 100vh;
    padding: 1rem;
  }
  .container { max-width: 640px; margin: 3rem auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  h1 { font-size: 1.375rem; color: #111827; }
  .logout button {
    background: none; border: 1px solid #d1d5db; color: #374151;
    padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8125rem; cursor: pointer;
  }
  .logout button:hover { background: #f9fafb; }
  .card {
    background: #fff; border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 2rem;
  }
  .card p { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.25rem; }
  .btn {
    padding: 0.6875rem 1.5rem; border: none; border-radius: 8px;
    font-size: 0.9375rem; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
  .btn-success { background: #059669; color: #fff; text-decoration: none; display: inline-block; }
  .btn-success:hover { background: #047857; }
  .status {
    margin-top: 1.5rem; padding: 1rem; border-radius: 8px;
    font-size: 0.875rem; display: none;
  }
  .status.running { display: block; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .status.done { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .status.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .progress-bar { background: #dbeafe; border-radius: 999px; height: 8px; margin-top: 0.75rem; overflow: hidden; }
  .progress-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.5s ease; }
  .download-row { margin-top: 1.25rem; display: none; }
  .meta { font-size: 0.8125rem; color: #6b7280; margin-top: 0.5rem; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #bfdbfe; border-top-color: #1e40af;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: -2px; margin-right: 0.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Student Data Download</h1>
      <form class="logout" method="POST" action="/logout"><button type="submit">Sign out</button></form>
    </div>
    <div class="card">
      <p>Fetches the full student list from Skill India (NSDC) and prepares a CSV file for download. This can take several minutes depending on the number of students.</p>
      <button class="btn btn-primary" id="startBtn">Fetch student data</button>

      <div class="status" id="status"></div>

      <div class="download-row" id="downloadRow">
        <a class="btn btn-success" href="/api/download/file">Download CSV</a>
        <div class="meta" id="fileMeta"></div>
      </div>
    </div>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
